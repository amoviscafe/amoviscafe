<!DOCTYPE html>
<html lang="mr">
<head>

<meta charset="UTF-8">

<title>Brocodes Cafe Menu</title>

<style>

*{box-sizing:border-box}

body{
margin:0;
font-family:Arial;
background:#111;
color:#fff;
}

.header{
background:#000;
color:#ffd966;
text-align:center;
padding:18px;
font-size:24px;
font-weight:bold;
}

.customer{
background:#222;
padding:10px;
display:flex;
gap:10px;
flex-wrap:wrap;
justify-content:center;
}

.customer input{
padding:10px;
border-radius:8px;
border:none;
width:180px;
font-size:15px;
}

.container{
max-width:900px;
margin:auto;
padding:15px;
padding-bottom:220px;
}

.category{
margin-top:25px;
font-size:22px;
color:#ffd966;
border-bottom:2px solid #444;
padding-bottom:5px;
}

.item{
display:flex;
justify-content:space-between;
align-items:center;
padding:10px;
border-bottom:1px solid #333;
}

.add-btn{
background:#00c853;
border:none;
color:white;
padding:6px 14px;
border-radius:20px;
cursor:pointer;
}

.cart{
position:fixed;
bottom:0;
left:0;
width:100%;
background:white;
color:black;
padding:15px;
max-height:45vh;
overflow:auto;
}

.cart-item{
display:flex;
justify-content:space-between;
padding:6px 0;
}

.qty-btn{
background:#2575fc;
border:none;
color:white;
width:28px;
height:28px;
border-radius:50%;
cursor:pointer;
}

.place{
width:100%;
padding:14px;
border:none;
background:#2575fc;
color:white;
font-size:18px;
border-radius:30px;
margin-top:10px;
}

@media(max-width:600px){

.customer{
flex-direction:column;
}

.customer input{
width:100%;
}

.item{
font-size:14px;
}

}

</style>

</head>

<div class="header">☕ BROCODES CAFE MENU</div>

<div class="customer">

<input id="custName" placeholder="Customer Name">

<input id="custMobile"
placeholder="Mobile Number"
maxlength="10"
inputmode="numeric"
oninput="this.value=this.value.replace(/[^0-9]/g,'')">

</div>

<div class="container" id="menu"></div>

<div class="cart">

<h3>🛒 Cart</h3>

<div id="cart"></div>

<div>Total ₹ <span id="total">0</span></div>

<button class="place" onclick="placeOrder()">Place Order</button>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

<script>

firebase.initializeApp({
apiKey:"AIzaSyBymiTjjqUN-AAspzoA_bOGUWOzEc9o3jA",
authDomain:"amovis-cafe-booking.firebaseapp.com",
projectId:"amovis-cafe-booking"
})

const db=firebase.firestore()

const params=new URLSearchParams(location.search)

const orderType=params.get("type") || "direct"

const orderNo=params.get("no") || "-"

/* AUTO FILL CUSTOMER */

db.collection("orders")
.where("type","==",orderType)
.where("no","==",orderNo)
.where("status","in",["new","accepted"])
.limit(1)
.get()
.then(snap=>{

if(!snap.empty){

const d=snap.docs[0].data()

custName.value=d.customerName
custMobile.value=d.customerMobile

custName.disabled=true
custMobile.disabled=true

/* BUILD MENU */

let menu=document.getElementById("menu")

for(let cat in menuData){

menu.innerHTML+=`<div class="category">${cat}</div>`

menuData[cat].forEach(i=>{

menu.innerHTML+=`
<div class="item">
${i[0]} ₹${i[1]}
<button class="add-btn" onclick="addItem('${i[0]}',${i[1]})">ADD</button>
</div>`

})

}

/* CART */

let cart={}

function addItem(name,price){

cart[name]?cart[name].qty++:cart[name]={price,qty:1}

render()

}

function changeQty(name,val){

cart[name].qty+=val

if(cart[name].qty<=0)
delete cart[name]

render()

}

function render(){

let div=document.getElementById("cart")
let total=0

div.innerHTML=""

for(let i in cart){

let item=cart[i]

total+=item.price*item.qty

div.innerHTML+=`
<div class="cart-item">
<span>${i} x ${item.qty}</span>
<div>
<button class="qty-btn" onclick="changeQty('${i}',-1)">-</button>
<button class="qty-btn" onclick="changeQty('${i}',1)">+</button>
</div>
</div>`

}

document.getElementById("total").innerText=total

}

/* PLACE ORDER */

function placeOrder(){

let name=document.getElementById("custName").value.trim()
let mobile=document.getElementById("custMobile").value.trim()

if(name===""){
alert("नाव टाका")
return
}

if(!/^[6-9]\d{9}$/.test(mobile)){
alert("योग्य मोबाईल नंबर टाका")
return
}

if(Object.keys(cart).length===0){
alert("Item add करा")
return
}

/* SAME ORDER CHECK */

db.collection("orders")
.where("customerMobile","==",mobile)
.where("type","==",orderType)
.where("no","==",orderNo)
.where("status","in",["new","accepted"])
.limit(1)
.get()
.then(snap=>{

if(!snap.empty){

const doc=snap.docs[0]

let old=doc.data().items

for(let n in cart){

old[n]?old[n].qty+=cart[n].qty:old[n]=cart[n]

}

return doc.ref.update({items:old})

}

else{

return db.collection("orders").add({

customerName:name,
customerMobile:mobile,
items:cart,
status:"new",
type:orderType,
no:orderNo,
createdAt:firebase.firestore.FieldValue.serverTimestamp()

})

}

})

.then(()=>{

alert("Order Sent To Kitchen")

cart={}
render()

})

}
